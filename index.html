<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дневник — итог дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #fbf6f4;
    --card: #ffffff;
    --card2: #f7efec;
    --text: #3f3438;
    --muted: #9c8a8d;
    --accent: #c98a94;
    --accent-soft: #f6e6e8;
    --line: #efe1de;
    --red: #c2696b;
    --shadow: 0 2px 14px rgba(150, 110, 115, .07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 26px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: .2px;
    margin-bottom: 5px;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .switch {
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 20px;
    padding: 7px 14px;
    margin-bottom: 20px;
    cursor: pointer;
    font-family: inherit;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(16px);
    animation: rise .5s cubic-bezier(.22,.9,.36,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  h1, .sub, .switch { opacity: 0; animation: rise .5s ease forwards; }
  .sub { animation-delay: .07s; }
  .switch { animation-delay: .12s; }
  #done { animation: rise .45s ease forwards; }
  .q { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .scale { display: flex; flex-wrap: wrap; gap: 6px; }
  .scale button {
    flex: 0 0 calc(20% - 5px);
    height: 44px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .scale button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button.sel { background: var(--accent-soft); border-color: var(--accent); color: #a3606b; }
  .chips button.theme { border-style: dashed; }
  .chips button.theme.has { border-style: solid; border-color: var(--accent); }
  .chips button.back { background: var(--bg); color: var(--muted); }
  textarea, input[type=text] {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 13px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px;
    outline: none;
  }
  textarea { min-height: 76px; resize: vertical; }
  textarea.big { min-height: 130px; }
  textarea:focus, input[type=text]:focus { border-color: var(--accent); }
  .submit {
    width: 100%;
    height: 54px;
    border-radius: 17px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: var(--shadow);
  }
  .submit:disabled { opacity: .5; }
  .err { color: var(--red); font-size: 13.5px; text-align: center; margin-top: 10px; display: none; }
  #done { display: none; text-align: center; padding-top: 90px; }
  #done .big { font-size: 52px; margin-bottom: 16px; }
  #done h2 { font-family: Georgia, serif; font-size: 22px; font-weight: 400; margin-bottom: 8px; }
  #done p { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>

<div id="main">
  <h1 id="greet">Как прошёл день?</h1>
  <div class="sub" id="dateline"></div>
  <button class="switch" id="modeBtn" onclick="toggleMode()">Итоги месяца →</button>
  <div id="form"></div>
  <button class="submit" id="send" onclick="submitForm()">Сохранить день</button>
  <div class="err" id="err">Заполни, пожалуйста, все шкалы и обязательные вопросы</div>
</div>

<div id="done">
  <div class="big">🌸</div>
  <h2>Записано</h2>
  <p>Спасибо. Увидимся завтра.</p>
</div>

<script>
/* ============================================================
   НАСТРОЙКА — заполняется Клодом при сборке.
   Ниже три места, помеченные ЗАМЕНИТЬ. Всё остальное не трогать.
   ============================================================ */

/* ЗАМЕНИТЬ 1: адрес отправки формы.
   Берётся из ссылки на форму: .../viewform  ->  .../formResponse   */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeUjIEMfAkmPsg7ClOToOkzO8yYr2krKffgW1MTYItjckTSxA/formResponse";

/* ЗАМЕНИТЬ 2: ежедневные вопросы.
   id — это число из entry.XXXXXXX соответствующего вопроса формы.   */
const SCALES = [
  { id: 1870858216, title: "Оценка дня",                 hint: "1 — худший день, 10 — лучший",              from: 1, to: 10 },
  { id: 206272625,  title: "Энергия",                    hint: "1 — совсем без сил, 10 — полна сил",        from: 1, to: 10 },
  { id: 1971562768, title: "Настроение",                 hint: "1 — тяжело, 10 — светло",                   from: 1, to: 10 },
  { id: 120697620,  title: "Качество сна прошлой ночью", hint: "1 — плохо спала, 10 — отлично выспалась",    from: 1, to: 10 }
];

const DRILLS = [
  { id: 362542484, title: "Что беспокоило сегодня?", hint: "Выбери тему, внутри отметь нужное", required: true,
    quick: ["Ничего"],
    themes: [
      { label: "Тело",     opts: ["Голова", "Живот / ЖКТ", "Кожа", "Отёки"] },
      { label: "Цикл",     opts: ["ПМС", "Месячные", "Тянет низ живота"] },
      { label: "Состояние",opts: ["Тревожность", "Раздражительность", "Апатия"] }
    ] },
  { id: 671335351, title: "Общее по дню", hint: "Выбери тему, внутри отметь нужное", required: false,
    quick: [],
    themes: [
      { label: "Еда и напитки", opts: ["Кофе", "Сладкое", "Жирное / жареное", "Кислое / острое", "Поздний приём пищи"] },
      { label: "Активность",    opts: ["Тренировка", "Танцы", "Прогулка"] },
      { label: "Для себя",      opts: ["Уход за собой", "Отдых без экрана", "Время с близкими"] }
    ],
    withText: { id: 1515348337, label: "Что хочется выделить?", ph: "Что запомнилось, что порадовало, что тянуло вниз — пара строк…" } }
];

const TEXTS = [];

/* ЗАМЕНИТЬ 3: вопросы месячного разбора.
   Появляются по кнопке «Итоги месяца» и пишутся в ту же таблицу.   */
const MONTHLY = [
  { id: 807721248,  title: "Каким был этот месяц?",              ph: "Одним абзацем, как рассказала бы подруге…" },
  { id: 1653560237, title: "Чем он запомнится через год?",       ph: "Люди, места, разговоры, решения…" },
  { id: 319014722,  title: "Что забирало силы?",                 ph: "Что хочется в следующем месяце убрать или уменьшить…" },
  { id: 1924270514, title: "Чем я горжусь в этом месяце?",       ph: "Даже мелочи считаются…" },
  { id: 64438710,   title: "Чего хочу от следующего месяца?",    ph: "Не цели ради целей, а то, чего действительно хочется…" }
];
/* Если месячного разбора пока нет — оставь MONTHLY пустым: const MONTHLY = [];
   Кнопка «Итоги месяца» тогда сама спрячется.                       */

/* ============================================================
   Дальше менять ничего не нужно.
   ============================================================ */

const answers = { scales: {}, checks: {}, texts: {}, others: {}, monthly: {} };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = () => { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); };

const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const monthsNom = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const now = new Date();

let mode = "day";
const root = document.getElementById("form");
const modeBtn = document.getElementById("modeBtn");
if (!MONTHLY.length) modeBtn.style.display = "none";

function toggleMode() {
  mode = (mode === "day") ? "month" : "day";
  haptic();
  render();
}

function render() {
  root.innerHTML = "";
  cardIndex = 0;
  if (mode === "day") {
    document.getElementById("greet").textContent = "Как прошёл день?";
    document.getElementById("dateline").textContent =
      "Сегодня " + now.getDate() + " " + months[now.getMonth()] + ", пара минут — и готово";
    modeBtn.textContent = "Итоги месяца →";
    document.getElementById("send").textContent = "Сохранить день";
    buildDay();
  } else {
    document.getElementById("greet").textContent = "Итоги месяца";
    document.getElementById("dateline").textContent =
      monthsNom[now.getMonth()] + " " + now.getFullYear() + " — не спеши, это надолго останется";
    modeBtn.textContent = "← Вернуться к дню";
    document.getElementById("send").textContent = "Сохранить месяц";
    buildMonth();
  }
}

let cardIndex = 0;
function stagger(card) {
  card.style.animationDelay = Math.min(cardIndex * 70, 600) + "ms";
  cardIndex++;
}

function buildDay() {
  SCALES.forEach(s => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="q">' + s.title + '</div><div class="hint">' + s.hint + '</div>';
    const row = document.createElement("div");
    row.className = "scale";
    for (let v = s.from; v <= s.to; v++) {
      const b = document.createElement("button");
      b.textContent = v;
      if (answers.scales[s.id] === v) b.classList.add("sel");
      b.onclick = () => {
        answers.scales[s.id] = v;
        row.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        haptic();
      };
      row.appendChild(b);
    }
    card.appendChild(row);
    stagger(card);
    root.appendChild(card);
  });

  DRILLS.forEach(c => {
    if (!answers.checks[c.id]) answers.checks[c.id] = new Set();
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="q">' + c.title + '</div><div class="hint">' + c.hint + '</div>';
    const wrap = document.createElement("div");
    wrap.className = "chips";

    const oi = document.createElement("input");
    oi.type = "text";
    oi.placeholder = "Свой вариант";
    oi.style.cssText = "display:none;margin-top:10px;";
    oi.value = answers.others[c.id] || "";
    oi.oninput = () => { answers.others[c.id] = oi.value.trim(); };
    let otherOn = !!(answers.others[c.id] || "").length;
    if (otherOn) oi.style.display = "block";

    const set = answers.checks[c.id];
    const allOpts = c.themes.flatMap(t => t.opts);
    const themeCount = t => t.opts.filter(o => set.has(o)).length;

    function showThemes() {
      wrap.innerHTML = "";
      c.quick.forEach(o => {
        const b = document.createElement("button");
        b.textContent = o;
        if (set.has(o)) b.classList.add("sel");
        b.onclick = () => {
          if (set.has(o)) set.delete(o);
          else if (o === "Ничего") {
            allOpts.forEach(x => set.delete(x));
            set.add(o);
            otherOn = false; oi.style.display = "none"; oi.value = ""; answers.others[c.id] = "";
          }
          else set.add(o);
          haptic(); showThemes();
        };
        wrap.appendChild(b);
      });
      c.themes.forEach(t => {
        const n = themeCount(t);
        const b = document.createElement("button");
        b.className = "theme" + (n > 0 ? " has" : "");
        b.textContent = t.label + (n > 0 ? " · " + n : "");
        b.onclick = () => { haptic(); showTheme(t); };
        wrap.appendChild(b);
      });
      const ob = document.createElement("button");
      ob.textContent = "Другое…";
      if (otherOn) ob.classList.add("sel");
      ob.onclick = () => {
        otherOn = !otherOn;
        oi.style.display = otherOn ? "block" : "none";
        if (otherOn) { set.delete("Ничего"); oi.focus(); }
        else { oi.value = ""; answers.others[c.id] = ""; }
        haptic(); showThemes();
      };
      wrap.appendChild(ob);
    }

    function showTheme(t) {
      wrap.innerHTML = "";
      const back = document.createElement("button");
      back.className = "back";
      back.textContent = "← Назад";
      back.onclick = () => { haptic(); showThemes(); };
      wrap.appendChild(back);
      t.opts.forEach(o => {
        const b = document.createElement("button");
        b.textContent = o;
        if (set.has(o)) b.classList.add("sel");
        b.onclick = () => {
          if (set.has(o)) { set.delete(o); b.classList.remove("sel"); }
          else { set.delete("Ничего"); set.add(o); b.classList.add("sel"); }
          haptic();
        };
        wrap.appendChild(b);
      });
    }

    showThemes();
    card.appendChild(wrap);
    card.appendChild(oi);

    if (c.withText) {
      const tl = document.createElement("div");
      tl.className = "q";
      tl.style.cssText = "margin-top:16px;margin-bottom:8px;";
      tl.textContent = c.withText.label;
      const ta = document.createElement("textarea");
      ta.placeholder = c.withText.ph;
      ta.value = answers.texts[c.withText.id] || "";
      ta.oninput = () => { answers.texts[c.withText.id] = ta.value; };
      card.appendChild(tl);
      card.appendChild(ta);
    }

    stagger(card);
    root.appendChild(card);
  });

  TEXTS.forEach(t => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="q" style="margin-bottom:10px">' + t.title + '</div>';
    const ta = document.createElement("textarea");
    ta.placeholder = t.ph;
    ta.value = answers.texts[t.id] || "";
    ta.oninput = () => { answers.texts[t.id] = ta.value; };
    card.appendChild(ta);
    stagger(card);
    root.appendChild(card);
  });
}

function buildMonth() {
  MONTHLY.forEach(m => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="q" style="margin-bottom:10px">' + m.title + '</div>';
    const ta = document.createElement("textarea");
    ta.className = "big";
    ta.placeholder = m.ph;
    ta.value = answers.monthly[m.id] || "";
    ta.oninput = () => { answers.monthly[m.id] = ta.value; };
    card.appendChild(ta);
    stagger(card);
    root.appendChild(card);
  });
}

function post(fields) {
  const f = document.createElement("form");
  f.action = FORM_URL;
  f.method = "POST";
  f.target = "hidden_iframe";
  f.style.display = "none";
  fields.forEach(([name, value]) => {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = name; i.value = value;
    f.appendChild(i);
  });
  const iframe = document.createElement("iframe");
  iframe.name = "hidden_iframe";
  iframe.style.display = "none";
  document.body.appendChild(iframe);
  document.body.appendChild(f);
  f.submit();
}

function finish(emoji, title, text) {
  setTimeout(() => {
    document.getElementById("main").style.display = "none";
    const d = document.getElementById("done");
    d.querySelector(".big").textContent = emoji;
    d.querySelector("h2").textContent = title;
    d.querySelector("p").textContent = text;
    d.style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (tg) setTimeout(() => tg.close(), 2500);
  }, 1200);
}

function submitForm() {
  const err = document.getElementById("err");

  if (FORM_URL.indexOf("ЗАМЕНИТЬ") !== -1) {
    err.textContent = "Страница ещё не настроена: не указан адрес формы (FORM_URL)";
    err.style.display = "block";
    return;
  }

  if (mode === "month") {
    const any = MONTHLY.some(m => (answers.monthly[m.id] || "").trim().length > 0);
    if (!any) {
      err.textContent = "Напиши хотя бы про один вопрос";
      err.style.display = "block";
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    err.style.display = "none";
    document.getElementById("send").disabled = true;
    const fields = [];
    MONTHLY.forEach(m => {
      if ((answers.monthly[m.id] || "").trim().length > 0)
        fields.push(["entry." + m.id, answers.monthly[m.id]]);
    });
    post(fields);
    finish("🕊", "Месяц записан", "Через год это будет приятно перечитать.");
    return;
  }

  const allScales = SCALES.every(s => answers.scales[s.id] !== undefined);
  const reqChecks = DRILLS.filter(c => c.required)
    .every(c => (answers.checks[c.id] && answers.checks[c.id].size > 0) || (answers.others[c.id] || "").length > 0);
  if (!allScales || !reqChecks) {
    err.textContent = "Заполни, пожалуйста, все шкалы и обязательные вопросы";
    err.style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  err.style.display = "none";
  document.getElementById("send").disabled = true;

  const fields = [];
  SCALES.forEach(s => fields.push(["entry." + s.id, answers.scales[s.id]]));
  DRILLS.forEach(c => {
    (answers.checks[c.id] || new Set()).forEach(v => fields.push(["entry." + c.id, v]));
    if ((answers.others[c.id] || "").length > 0) {
      fields.push(["entry." + c.id, "__other_option__"]);
      fields.push(["entry." + c.id + ".other_option_response", answers.others[c.id]]);
    }
    if (c.withText && (answers.texts[c.withText.id] || "").length > 0)
      fields.push(["entry." + c.withText.id, answers.texts[c.withText.id]]);
  });
  TEXTS.forEach(t => { if (answers.texts[t.id]) fields.push(["entry." + t.id, answers.texts[t.id]]); });

  post(fields);
  finish("🌸", "День записан", "Спасибо. Увидимся завтра.");
}

render();
</script>
</body>
</html>
